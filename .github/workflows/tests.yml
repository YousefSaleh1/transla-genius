name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # SQL Server has not had a green run yet. Remove this once it has.
    continue-on-error: ${{ matrix.db == 'sqlsrv' }}

    strategy:
      fail-fast: false
      matrix:
        # Base grid: every supported PHP x Laravel x dependency-stability
        # combination, on SQLite. Catches constraint and framework-version
        # problems cheaply, with no service container.
        php: ["8.3", "8.4"]
        laravel: ["^12.0", "^13.0"]
        stability: ["prefer-stable", "prefer-lowest"]
        db: ["sqlite"]
        include:
          # Matching testbench per Laravel major (added to the base cells).
          - laravel: "^12.0"
            testbench: "^10.0"
          - laravel: "^13.0"
            testbench: "^11.0"

          # Every database on the newest stack: the JSON-path SQL differs by
          # driver, not by PHP version, so one full pass is enough there.
          - { php: "8.4", laravel: "^13.0", testbench: "^11.0", stability: "prefer-stable", db: "mysql", db_image: "mysql:8.0", db_port: "3306", db_user: "root", db_password: "" }
          - { php: "8.4", laravel: "^13.0", testbench: "^11.0", stability: "prefer-stable", db: "mariadb", db_image: "mariadb:10.6", db_port: "3306", db_user: "root", db_password: "" }
          - { php: "8.4", laravel: "^13.0", testbench: "^11.0", stability: "prefer-stable", db: "pgsql", db_image: "postgres:16", db_port: "5432", db_user: "postgres", db_password: "" }
          - { php: "8.4", laravel: "^13.0", testbench: "^11.0", stability: "prefer-stable", db: "sqlsrv", db_image: "mcr.microsoft.com/mssql/server:2022-latest", db_port: "1433", db_user: "sa", db_password: "TranslaGenius_CI_2024!" }

          # The query grammar lives in the framework, so also run the two most
          # common server databases on the oldest stack we allow.
          - { php: "8.3", laravel: "^12.0", testbench: "^10.0", stability: "prefer-lowest", db: "mysql", db_image: "mysql:8.0", db_port: "3306", db_user: "root", db_password: "" }
          - { php: "8.3", laravel: "^12.0", testbench: "^10.0", stability: "prefer-lowest", db: "pgsql", db_image: "postgres:16", db_port: "5432", db_user: "postgres", db_password: "" }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.db }}

    services:
      db:
        # An empty image (the sqlite cells) means no service container starts.
        image: ${{ matrix.db_image || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          POSTGRES_HOST_AUTH_METHOD: trust
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ matrix.db_password }}
        ports:
          - ${{ matrix.db_port || '3306' }}:${{ matrix.db_port || '3306' }}

    env:
      TRANSLAGENIUS_TEST_DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db_port }}
      DB_DATABASE: translagenius_test
      DB_USERNAME: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_password }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql${{ matrix.db == 'sqlsrv' && ', pdo_sqlsrv' || '' }}
          coverage: none

      # Audits the committed composer.lock, before this cell's require/update
      # steps re-resolve dependencies. One cell is enough: the lock is the same
      # file everywhere.
      - name: Audit locked dependencies
        if: matrix.php == '8.4' && matrix.laravel == '^13.0' && matrix.stability == 'prefer-stable' && matrix.db == 'sqlite'
        run: composer audit --locked --no-interaction

      - name: Require Laravel ${{ matrix.laravel }} with testbench ${{ matrix.testbench }}
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies (${{ matrix.stability }})
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Wait for database
        id: wait_db
        if: matrix.db != 'sqlite'
        run: |
          cat > "$RUNNER_TEMP/db-probe.php" <<'PHP'
          <?php
          $c = getenv('TRANSLAGENIUS_TEST_DB_CONNECTION');
          $h = getenv('DB_HOST');
          $p = getenv('DB_PORT');
          $dsn = match ($c) {
              'mysql', 'mariadb' => "mysql:host=$h;port=$p",
              'pgsql' => "pgsql:host=$h;port=$p;dbname=postgres",
              'sqlsrv' => "sqlsrv:Server=$h,$p;TrustServerCertificate=1",
          };
          try {
              new PDO($dsn, getenv('DB_USERNAME'), getenv('DB_PASSWORD'));
          } catch (Throwable $e) {
              echo get_class($e) . ': ' . $e->getMessage() . PHP_EOL;
              exit(1);
          }
          PHP
          # Quiet while waiting; the last attempt's error is printed below.
          for i in $(seq 1 60); do
            if php "$RUNNER_TEMP/db-probe.php" > "$RUNNER_TEMP/db-probe.log" 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Database did not become ready in time. Last connection error:"
          cat "$RUNNER_TEMP/db-probe.log"
          exit 1

      # Only when the wait failed: enough to tell a missing driver from a
      # server that never came up.
      - name: Diagnose database startup
        if: failure() && steps.wait_db.outcome == 'failure'
        run: |
          echo "--- PHP PDO / sqlsrv modules"
          php -m | grep -iE 'pdo|sqlsrv' || echo "(none matched)"
          echo "--- Registered ODBC drivers"
          odbcinst -q -d 2>/dev/null || echo "(odbcinst not available)"
          echo "--- Service container logs (${{ job.services.db.id }})"
          docker logs "${{ job.services.db.id }}" 2>&1 | tail -n 200 || true

      - name: Run test suite
        # The live group calls real provider APIs; it is opt-in, never run in CI.
        run: vendor/bin/phpunit --exclude-group live
